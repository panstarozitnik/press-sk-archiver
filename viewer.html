<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>press.sk Archív</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  :root {
    --bg: #0f0e0c; --surface: #1a1815; --surface2: #201e1a;
    --border: #2e2b26; --accent: #c8a96e; --accent2: #7eb89a;
    --text: #e8e0d0; --muted: #6b6458;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-weight: 300; min-height: 100vh; }

  header { border-bottom: 1px solid var(--border); padding: 1.2rem 2rem; display: flex; align-items: center; gap: 2rem; flex-wrap: wrap; }
  .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900; color: var(--accent); }
  .logo span { color: var(--muted); font-size: 0.75rem; display: block; font-family: 'IBM Plex Mono', monospace; }
  .stats { font-family: 'IBM Plex Mono', monospace; font-size: 0.75rem; color: var(--muted); margin-left: auto; line-height: 1.8; }
  .stats strong { color: var(--accent); font-size: 1rem; }

  .controls {
    padding: 0.8rem 2rem; border-bottom: 1px solid var(--border);
    display: flex; gap: 0.7rem; flex-wrap: wrap; align-items: center;
    background: var(--surface); position: sticky; top: 0; z-index: 10;
  }
  .search-wrap { position: relative; flex: 1; min-width: 200px; max-width: 380px; }
  .search-wrap svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  input[type=text], select {
    background: var(--bg); border: 1px solid var(--border); color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 0.83rem;
    padding: 0.45rem 0.75rem; border-radius: 3px; outline: none; transition: border-color 0.15s;
  }
  input[type=text] { padding-left: 2rem; width: 100%; }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  select { cursor: pointer; } select option { background: var(--bg); }
  .filter-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--muted); margin-left: auto; }

  /* Upload */
  #upload-zone { margin: 4rem auto; max-width: 440px; border: 2px dashed var(--border); border-radius: 8px; padding: 3rem 2rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
  #upload-zone:hover, #upload-zone.drag { border-color: var(--accent); background: rgba(200,169,110,0.04); }
  #upload-zone h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--accent); margin-bottom: 0.4rem; }
  #upload-zone p { color: var(--muted); font-size: 0.83rem; line-height: 1.6; }
  #upload-zone input { display: none; }
  .upload-icon { font-size: 2.5rem; margin-bottom: 0.8rem; }

  /* Rows */
  #rows { display: none; }

  .product-row {
    display: flex; border-bottom: 1px solid var(--border);
    transition: background 0.1s; animation: fadeIn 0.2s ease both;
  }
  .product-row:hover { background: var(--surface); }

  /* Ľavý stĺpec — obrázky */
  .row-imgs {
    flex-shrink: 0; width: 200px; min-height: 76px;
    display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start;
    padding: 0.6rem; border-right: 1px solid var(--border);
    background: var(--surface2);
  }
  .row-imgs img {
    width: 58px; height: 58px; object-fit: cover; border-radius: 2px;
    cursor: zoom-in; border: 1px solid transparent; transition: border-color 0.12s, transform 0.12s;
  }
  .row-imgs img:hover { border-color: var(--accent); transform: scale(1.06); }
  .no-img { width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: var(--border); border-radius: 2px; border: 1px dashed var(--border); }

  /* Pravý stĺpec — info */
  .row-info { flex: 1; padding: 0.6rem 1rem; display: flex; flex-direction: column; gap: 0.2rem; min-width: 0; }
  .row-title { font-family: 'Playfair Display', serif; font-size: 0.92rem; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-author { font-size: 0.76rem; color: var(--muted); }
  .row-meta { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.15rem; align-items: center; }
  .tag-cat { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--accent2); text-transform: uppercase; letter-spacing: 0.08em; }
  .tag-pub { font-size: 0.71rem; color: var(--muted); }
  .tag-price { font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; color: var(--accent); }
  .tag-date { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); }
  .row-links { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.25rem; }
  .row-link { font-family: 'IBM Plex Mono', monospace; font-size: 0.62rem; color: var(--muted); text-decoration: none; transition: color 0.12s; }
  .row-link:hover { color: var(--accent); }

  /* Počet obrázkov — badge */
  .img-badge { flex-shrink: 0; padding: 0.6rem 0.5rem; font-family: 'IBM Plex Mono', monospace; font-size: 0.6rem; color: var(--muted); align-self: flex-start; white-space: nowrap; }

  /* Lightbox */
  #lb { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.93); z-index: 200; align-items: center; justify-content: center; cursor: zoom-out; }
  #lb.open { display: flex; }
  #lb img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 3px; }
  #lb-close { position: fixed; top: 1rem; right: 1.5rem; color: #fff; font-size: 1.8rem; cursor: pointer; opacity: 0.7; }
  #lb-close:hover { opacity: 1; }

  /* Pagination */
  .pagination { padding: 1rem 2rem; display: flex; gap: 0.35rem; align-items: center; border-top: 1px solid var(--border); flex-wrap: wrap; }
  .page-btn { background: var(--surface); border: 1px solid var(--border); color: var(--muted); padding: 0.3rem 0.65rem; cursor: pointer; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 0.73rem; transition: all 0.12s; }
  .page-btn:hover, .page-btn.active { border-color: var(--accent); color: var(--accent); }
  .page-info { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; margin-left: auto; }

  #empty { text-align: center; padding: 4rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; display: none; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; } }
</style>
</head>
<body>

<header>
  <div class="logo">press.sk <span>— archív produktov</span></div>
  <div class="stats" id="stats">Načítaj CSV súbor</div>
</header>

<div class="controls" id="controls" style="display:none">
  <div class="search-wrap">
    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Hľadaj názov, autora, vydavateľa…">
  </div>
  <select id="cat-filter"><option value="">Všetky kategórie</option></select>
  <select id="sort">
    <option value="title">Názov A–Z</option>
    <option value="title-desc">Názov Z–A</option>
    <option value="category">Kategória</option>
    <option value="date">Dátum (najnovšie)</option>
    <option value="date-asc">Dátum (najstaršie)</option>
    <option value="imgs-desc">Najviac obrázkov</option>
  </select>
  <span class="filter-count" id="filter-count"></span>
</div>

<div id="upload-zone">
  <div class="upload-icon">📚</div>
  <h2>press.sk Archív Viewer</h2>
  <p>Pretiahni <strong>products.csv</strong> sem<br>alebo klikni pre výber súboru</p>
  <input type="file" id="file-input" accept=".csv">
</div>

<div id="rows"></div>
<div id="empty">Žiadne výsledky pre tento filter.</div>
<div class="pagination" id="pagination" style="display:none"></div>

<div id="lb">
  <span id="lb-close" onclick="closeLb()">✕</span>
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()">
</div>

<script>
const PAGE_SIZE = 60;
let allData = [], filtered = [], currentPage = 1;

// CSV
function parseCSV(text) {
  const lines = text.split('\n');
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (vals[idx] || '').trim());
    if (obj.title) rows.push(obj);
  }
  return rows;
}
function parseCSVLine(line) {
  const r = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === ',' && !inQ) { r.push(cur); cur = ''; }
    else cur += c;
  }
  r.push(cur); return r;
}

function getImgs(r) {
  return [...new Set((r.image_urls || '').split('|').map(u => u.trim()).filter(Boolean))];
}
function formatDate(ts) {
  if (!ts || ts.length < 8) return '';
  return `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)}`;
}

// Load
function loadData(data) {
  allData = data;
  document.getElementById('upload-zone').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('rows').style.display = 'block';

  const cats = [...new Set(data.map(r => r.category).filter(Boolean))].sort();
  const sel = document.getElementById('cat-filter');
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });

  const withImg = data.filter(r => getImgs(r).length > 0).length;
  document.getElementById('stats').innerHTML =
    `<strong>${data.length.toLocaleString('sk')}</strong> produktov &nbsp;·&nbsp; ${withImg.toLocaleString('sk')} s obrázkom`;

  applyFilters();
}

// Filters
function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const sort = document.getElementById('sort').value;

  filtered = allData.filter(r => {
    if (q && !['title','author','publisher','category'].some(k => (r[k]||'').toLowerCase().includes(q))) return false;
    if (cat && r.category !== cat) return false;
    return true;
  });

  filtered.sort((a, b) => {
    if (sort === 'title') return (a.title||'').localeCompare(b.title||'', 'sk');
    if (sort === 'title-desc') return (b.title||'').localeCompare(a.title||'', 'sk');
    if (sort === 'category') return (a.category||'').localeCompare(b.category||'', 'sk');
    if (sort === 'date') return (b.timestamp||'').localeCompare(a.timestamp||'');
    if (sort === 'date-asc') return (a.timestamp||'').localeCompare(b.timestamp||'');
    if (sort === 'imgs-desc') return getImgs(b).length - getImgs(a).length;
    return 0;
  });

  const fc = document.getElementById('filter-count');
  fc.textContent = filtered.length < allData.length ? `${filtered.length.toLocaleString('sk')} výsledkov` : '';

  currentPage = 1;
  render();
}

// Render
function render() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  const container = document.getElementById('rows');
  container.innerHTML = '';

  document.getElementById('empty').style.display = filtered.length === 0 ? 'block' : 'none';

  page.forEach((r, i) => {
    const imgs = getImgs(r);
    const row = document.createElement('div');
    row.className = 'product-row';
    row.style.animationDelay = `${Math.min(i * 0.008, 0.3)}s`;

    // Obrázky — max 9 miniatur
    const imgsHtml = imgs.length === 0
      ? '<div class="no-img">📖</div>'
      : imgs.slice(0, 9).map(u =>
          `<img src="${u}" loading="lazy" alt="" onerror="this.style.display='none'"
            onclick="openLb('${u.replace(/'/g,"\\'").replace(/"/g,'&quot;')}',event)">`
        ).join('');

    // Linky
    const pageUrls = (r.page_urls || '').split('|').filter(Boolean);
    const links = [
      r.wayback_url ? `<a class="row-link" href="${r.wayback_url}" target="_blank">↗ wayback</a>` : '',
      ...pageUrls.slice(0,3).map((u,i) => `<a class="row-link" href="${u}" target="_blank">📄 ${i+1}</a>`)
    ].filter(Boolean).join('');

    row.innerHTML = `
      <div class="row-imgs">${imgsHtml}</div>
      <div class="row-info">
        <div class="row-title" title="${r.title.replace(/"/g,'&quot;')}">${r.title}</div>
        ${r.author ? `<div class="row-author">${r.author}</div>` : ''}
        <div class="row-meta">
          ${r.category  ? `<span class="tag-cat">${r.category}</span>` : ''}
          ${r.publisher ? `<span class="tag-pub">${r.publisher}</span>` : ''}
          ${r.price     ? `<span class="tag-price">${r.price}</span>` : ''}
          ${r.timestamp ? `<span class="tag-date">${formatDate(r.timestamp)}</span>` : ''}
        </div>
        ${links ? `<div class="row-links">${links}</div>` : ''}
      </div>
      ${imgs.length > 0 ? `<div class="img-badge">${imgs.length}×🖼</div>` : ''}
    `;
    container.appendChild(row);
  });

  renderPagination();
}

// Lightbox
function openLb(url, e) {
  e.stopPropagation();
  document.getElementById('lb-img').src = url;
  document.getElementById('lb').classList.add('open');
}
function closeLb() { document.getElementById('lb').classList.remove('open'); }
document.getElementById('lb').addEventListener('click', closeLb);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });

// Pagination
function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pag = document.getElementById('pagination');
  pag.innerHTML = '';
  if (total <= 1) { pag.style.display = 'none'; return; }
  pag.style.display = 'flex';

  const btn = (label, p, active = false) => {
    const b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { currentPage = p; render(); scrollTo(0,0); };
    pag.appendChild(b);
  };

  if (currentPage > 1) btn('←', currentPage - 1);
  let s = Math.max(1, currentPage - 2), e = Math.min(total, s + 4);
  if (e - s < 4) s = Math.max(1, e - 4);
  if (s > 1) btn('1', 1);
  for (let p = s; p <= e; p++) btn(p, p, p === currentPage);
  if (e < total) btn(total, total);
  if (currentPage < total) btn('→', currentPage + 1);

  const info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = `${filtered.length.toLocaleString('sk')} výsledkov · ${currentPage}/${total}`;
  pag.appendChild(info);
}

// File handling
function handleFile(file) {
  if (!file || !file.name.endsWith('.csv')) return;
  const reader = new FileReader();
  reader.onload = e => loadData(parseCSV(e.target.result));
  reader.readAsText(file, 'UTF-8');
}

function setupUpload() {
  const zone = document.getElementById('upload-zone');
  zone.addEventListener('click', () => document.getElementById('file-input').click());
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
  zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
  document.getElementById('file-input').addEventListener('change', e => handleFile(e.target.files[0]));
}

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('cat-filter').addEventListener('change', applyFilters);
document.getElementById('sort').addEventListener('change', applyFilters);
setupUpload();

// Auto-load z GitHub Pages
async function autoLoad() {
  const zone = document.getElementById('upload-zone');
  zone.innerHTML = `<div class="upload-icon">⏳</div><h2>Načítavam…</h2><p style="color:var(--muted);font-size:.8rem;font-family:'IBM Plex Mono',monospace">output/products.csv</p>`;
  for (const path of ['output/products.csv', 'products.csv']) {
    try {
      const resp = await fetch(path);
      if (!resp.ok) continue;
      const text = await resp.text();
      if (!text.includes('title')) continue;
      const data = parseCSV(text);
      if (data.length > 0) { loadData(data); return; }
    } catch (_) {}
  }
  zone.innerHTML = `<div class="upload-icon">📚</div><h2>press.sk Archív Viewer</h2><p>Pretiahni <strong>products.csv</strong> sem<br>alebo klikni pre výber súboru</p><input type="file" id="file-input" accept=".csv">`;
  setupUpload();
}
autoLoad();
</script>
</body>
</html>
