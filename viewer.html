<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>press.sk Archív</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --surface: #f7f6f4;
  --border: #e5e2dc;
  --accent: #8b4513;
  --accent2: #2d6a4f;
  --text: #1a1612;
  --muted: #8a8278;
  --tag-bg: #f0ede8;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}

/* HEADER */
header {
  border-bottom: 2px solid var(--text);
  padding: 1.5rem 2rem 1rem;
  display: flex;
  align-items: flex-end;
  gap: 2rem;
  flex-wrap: wrap;
}
.logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.02em;
}
.logo span {
  color: var(--muted);
  font-weight: 400;
  font-size: 0.85rem;
  display: block;
  font-family: 'IBM Plex Mono', monospace;
  letter-spacing: 0.05em;
  margin-top: 0.15rem;
}
.stats {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  color: var(--muted);
  margin-left: auto;
  text-align: right;
  line-height: 1.8;
}
.stats strong { color: var(--accent); font-size: 1rem; }

/* CONTROLS */
.controls {
  padding: 0.9rem 2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
  align-items: center;
  background: var(--surface);
}
.search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 360px; }
.search-wrap svg { position: absolute; left: 0.7rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
input[type=text], select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: 'IBM Plex Sans', sans-serif;
  font-size: 0.85rem;
  padding: 0.5rem 0.8rem;
  border-radius: 3px;
  outline: none;
  transition: border-color 0.15s;
}
input[type=text] { padding-left: 2.1rem; width: 100%; }
input[type=text]:focus, select:focus { border-color: var(--accent); }
select { cursor: pointer; }

/* UPLOAD */
#upload-zone {
  margin: 4rem auto;
  max-width: 460px;
  border: 2px dashed var(--border);
  border-radius: 6px;
  padding: 3rem 2rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
#upload-zone:hover, #upload-zone.drag { border-color: var(--accent); background: #fdf8f4; }
#upload-zone h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: var(--text); margin-bottom: 0.5rem; }
#upload-zone p { color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
#upload-zone input { display: none; }
.upload-icon { font-size: 2.5rem; margin-bottom: 1rem; }

/* ROWS */
#rows { border-top: 1px solid var(--border); }

.row {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--border);
  transition: background 0.1s;
  animation: fadeIn 0.25s ease both;
}
.row:hover { background: var(--surface); }

/* Obrázky — ľavý stĺpec */
.row-images {
  width: 220px;
  min-width: 220px;
  padding: 0.8rem;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  align-content: flex-start;
  border-right: 1px solid var(--border);
}
.row-images.no-img {
  align-items: center;
  justify-content: center;
  color: var(--border);
  font-size: 1.5rem;
}
.thumb {
  width: 64px;
  height: 64px;
  object-fit: cover;
  border-radius: 2px;
  cursor: pointer;
  border: 1px solid var(--border);
  transition: transform 0.15s, border-color 0.15s;
}
.thumb:hover { transform: scale(1.05); border-color: var(--accent); }
.thumb.main { width: 100px; height: 130px; }

/* Info — pravý stĺpec */
.row-info {
  flex: 1;
  padding: 0.9rem 1.2rem;
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
  min-width: 0;
}
.row-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}
.row-author { font-size: 0.8rem; color: var(--muted); }
.row-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.2rem;
  align-items: center;
}
.tag {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  padding: 0.15rem 0.45rem;
  border-radius: 2px;
  background: var(--tag-bg);
  color: var(--muted);
  border: 1px solid var(--border);
}
.tag.price { color: var(--accent); border-color: var(--accent); background: #fdf4ee; font-weight: 500; }
.tag.cat   { color: var(--accent2); border-color: var(--accent2); background: #eef7f2; }
.row-links {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.3rem;
}
.row-links a {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem;
  color: var(--muted);
  text-decoration: none;
  border-bottom: 1px dotted var(--border);
  transition: color 0.15s;
}
.row-links a:hover { color: var(--accent); }

/* Lightbox */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
#lightbox.open { display: flex; }
#lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 3px; }

/* PAGINATION */
.pagination {
  padding: 1.2rem 2rem;
  display: flex;
  gap: 0.4rem;
  align-items: center;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.page-btn {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 0.35rem 0.7rem;
  cursor: pointer;
  border-radius: 3px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  transition: all 0.15s;
}
.page-btn:hover, .page-btn.active { border-color: var(--accent); color: var(--accent); }
.page-info { color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; margin-left: auto; }

#empty { text-align: center; padding: 4rem 2rem; color: var(--muted); font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; display: none; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }

@media (max-width: 600px) {
  .row { flex-direction: column; }
  .row-images { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
}
</style>
</head>
<body>

<header>
  <div class="logo">press.sk <span>— archív produktov</span></div>
  <div class="stats" id="stats">Načítaj CSV súbor</div>
</header>

<div class="controls" id="controls" style="display:none">
  <div class="search-wrap">
    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Hľadaj názov, autora…">
  </div>
  <select id="cat-filter"><option value="">Všetky kategórie</option></select>
  <select id="sort">
    <option value="title">Názov A–Z</option>
    <option value="title-desc">Názov Z–A</option>
    <option value="category">Kategória</option>
    <option value="date">Dátum (najnovšie)</option>
    <option value="date-asc">Dátum (najstaršie)</option>
  </select>
  <label style="font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:.3rem;cursor:pointer">
    <input type="checkbox" id="only-img"> len s obrázkami
  </label>
</div>

<div id="upload-zone">
  <div class="upload-icon">📚</div>
  <h2>press.sk Archív Viewer</h2>
  <p>Pretiahni <strong>products.csv</strong> sem<br>alebo klikni pre výber súboru</p>
  <input type="file" id="file-input" accept=".csv">
</div>

<div id="rows"></div>
<div id="empty">Žiadne výsledky.</div>
<div class="pagination" id="pagination" style="display:none"></div>

<div id="lightbox" onclick="this.classList.remove('open')">
  <img id="lightbox-img" src="" alt="">
</div>

<script>
let allData = [], filtered = [];
const PAGE_SIZE = 50;
let currentPage = 1;

function parseCSV(text) {
  const lines = text.split('\n');
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (vals[idx] || '').trim());
    if (obj.title) rows.push(obj);
  }
  return rows;
}

function parseCSVLine(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += c;
  }
  result.push(cur);
  return result;
}

function formatDate(ts) {
  if (!ts || ts.length < 8) return '';
  return `${ts.slice(0,4)}-${ts.slice(4,6)}-${ts.slice(6,8)}`;
}

function loadData(data) {
  allData = data;
  document.getElementById('upload-zone').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('pagination').style.display = 'flex';

  const cats = [...new Set(data.map(r => r.category).filter(Boolean))].sort();
  const sel = document.getElementById('cat-filter');
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });

  const cats_n = new Set(data.map(r => r.category).filter(Boolean)).size;
  const with_img = data.filter(r => r.image_urls).length;
  document.getElementById('stats').innerHTML =
    `<strong>${data.length.toLocaleString('sk')}</strong> produktov &nbsp;·&nbsp; ${cats_n} kategórií &nbsp;·&nbsp; ${with_img.toLocaleString('sk')} s obrázkom`;

  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase();
  const cat = document.getElementById('cat-filter').value;
  const sort = document.getElementById('sort').value;
  const onlyImg = document.getElementById('only-img').checked;

  filtered = allData.filter(r => {
    if (onlyImg && !r.image_urls) return false;
    if (q && !(r.title||'').toLowerCase().includes(q) && !(r.author||'').toLowerCase().includes(q)) return false;
    if (cat && r.category !== cat) return false;
    return true;
  });

  filtered.sort((a, b) => {
    if (sort === 'title') return (a.title||'').localeCompare(b.title||'', 'sk');
    if (sort === 'title-desc') return (b.title||'').localeCompare(a.title||'', 'sk');
    if (sort === 'category') return (a.category||'').localeCompare(b.category||'', 'sk');
    if (sort === 'date') return (b.timestamp||'').localeCompare(a.timestamp||'');
    if (sort === 'date-asc') return (a.timestamp||'').localeCompare(b.timestamp||'');
    return 0;
  });

  currentPage = 1;
  render();
}

function render() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page = filtered.slice(start, start + PAGE_SIZE);
  const container = document.getElementById('rows');
  container.innerHTML = '';

  document.getElementById('empty').style.display = filtered.length === 0 ? 'block' : 'none';

  page.forEach((r, i) => {
    const imgs = (r.image_urls || '').split('|').map(u => u.trim()).filter(Boolean);
    const pageUrls = (r.page_urls || '').split('|').map(u => u.trim()).filter(Boolean);

    // Obrázky
    let imgsHtml;
    if (imgs.length === 0) {
      imgsHtml = `<div class="row-images no-img">📖</div>`;
    } else {
      const mainImg = `<img class="thumb main" src="${imgs[0]}" alt="" loading="lazy"
        onclick="event.stopPropagation();openLightbox('${imgs[0]}')"
        onerror="this.style.display='none'">`;
      const rest = imgs.slice(1).map(u =>
        `<img class="thumb" src="${u}" alt="" loading="lazy"
          onclick="event.stopPropagation();openLightbox('${u}')"
          onerror="this.style.display='none'">`
      ).join('');
      imgsHtml = `<div class="row-images">${mainImg}${rest}</div>`;
    }

    // Linky
    const links = [
      r.wayback_url ? `<a href="${r.wayback_url}" target="_blank">↗ wayback</a>` : '',
      ...pageUrls.slice(0,3).map((u,i) => `<a href="${u}" target="_blank">📄 stránka ${i+1}</a>`)
    ].filter(Boolean).join('');

    const row = document.createElement('div');
    row.className = 'row';
    row.style.animationDelay = `${i * 0.01}s`;
    row.innerHTML = `
      ${imgsHtml}
      <div class="row-info">
        <div class="row-title">${r.title}</div>
        ${r.author ? `<div class="row-author">${r.author}</div>` : ''}
        <div class="row-meta">
          ${r.price ? `<span class="tag price">${r.price}</span>` : ''}
          ${r.category ? `<span class="tag cat">${r.category}</span>` : ''}
          ${r.publisher ? `<span class="tag">${r.publisher}</span>` : ''}
          ${r.isbn ? `<span class="tag">ISBN ${r.isbn}</span>` : ''}
          ${r.timestamp ? `<span class="tag">${formatDate(r.timestamp)}</span>` : ''}
        </div>
        ${r.description ? `<div style="font-size:.78rem;color:var(--muted);margin-top:.3rem;line-height:1.5">${r.description.slice(0,200)}</div>` : ''}
        <div class="row-links">${links}</div>
      </div>`;
    container.appendChild(row);
  });

  renderPagination();
}

function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pag = document.getElementById('pagination');
  pag.innerHTML = '';
  if (total <= 1) { pag.style.display = 'none'; return; }
  pag.style.display = 'flex';

  const btn = (label, page, active=false) => {
    const b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { currentPage = page; render(); window.scrollTo(0,0); };
    pag.appendChild(b);
  };

  if (currentPage > 1) btn('←', currentPage - 1);
  let s = Math.max(1, currentPage - 2), e = Math.min(total, s + 4);
  if (e - s < 4) s = Math.max(1, e - 4);
  if (s > 1) { btn('1', 1); if (s > 2) pag.appendChild(Object.assign(document.createElement('span'), {className:'page-info', textContent:'…'})); }
  for (let p = s; p <= e; p++) btn(p, p, p === currentPage);
  if (e < total) { if (e < total-1) pag.appendChild(Object.assign(document.createElement('span'), {className:'page-info', textContent:'…'})); btn(total, total); }
  if (currentPage < total) btn('→', currentPage + 1);

  const info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = `${filtered.length.toLocaleString('sk')} výsledkov · strana ${currentPage}/${total}`;
  pag.appendChild(info);
}

function handleFile(file) {
  if (!file || !file.name.endsWith('.csv')) return;
  const reader = new FileReader();
  reader.onload = e => loadData(parseCSV(e.target.result));
  reader.readAsText(file, 'UTF-8');
}

// Event listeners
document.getElementById('file-input').addEventListener('change', e => handleFile(e.target.files[0]));
const zone = document.getElementById('upload-zone');
zone.addEventListener('click', () => document.getElementById('file-input').click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('cat-filter').addEventListener('change', applyFilters);
document.getElementById('sort').addEventListener('change', applyFilters);
document.getElementById('only-img').addEventListener('change', applyFilters);
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open'); });

// Auto-load
async function autoLoad() {
  for (const path of ['output/products.csv', 'products.csv']) {
    try {
      const resp = await fetch(path);
      if (!resp.ok) continue;
      const text = await resp.text();
      if (!text.includes('title')) continue;
      const data = parseCSV(text);
      if (data.length > 0) { loadData(data); return; }
    } catch (_) {}
  }
  // fallback — reset upload zone
  zone.innerHTML = `<div class="upload-icon">📚</div><h2>press.sk Archív Viewer</h2><p>Pretiahni <strong>products.csv</strong> sem<br>alebo klikni pre výber súboru</p><input type="file" id="file-input" accept=".csv">`;
  document.getElementById('file-input').addEventListener('change', e => handleFile(e.target.files[0]));
  zone.addEventListener('click', () => document.getElementById('file-input').click());
}
autoLoad();
</script>
</body>
</html>
