<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>press.sk Manažér produktov</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f5f4f1;
  --surface:  #ffffff;
  --surface2: #f0eee9;
  --border:   #ddd9d0;
  --text:     #1a1812;
  --muted:    #888;
  --dim:      #aaa;
  --accent:   #8b5e2a;
  --green:    #2e7d52;
  --red:      #c0392b;
  --blue:     #2563a8;
  --mono:     'JetBrains Mono', monospace;
  --sans:     'Inter', sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  display: flex;
  align-items: center;
  gap: 1.5rem;
  padding: 0.7rem 1.2rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  box-shadow: 0 1px 0 var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.logo {
  font-family: var(--mono);
  font-size: 0.8rem;
  font-weight: 500;
  color: var(--accent);
  letter-spacing: 0.08em;
  white-space: nowrap;
}
.stats {
  font-family: var(--mono);
  font-size: 0.7rem;
  color: var(--muted);
  white-space: nowrap;
}
.stats b { color: var(--text); }

/* ── STATUS TABS ── */
.status-tabs {
  display: flex;
  gap: 0;
  margin-left: auto;
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.status-tab {
  padding: 0.3rem 0.8rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  cursor: pointer;
  background: transparent;
  border: none;
  color: var(--muted);
  border-right: 1px solid var(--border);
  transition: all 0.15s;
}
.status-tab:last-child { border-right: none; }
.status-tab:hover { background: var(--surface2); color: var(--text); }
.status-tab.active { background: var(--surface2); color: var(--accent); }
.status-tab .cnt {
  display: inline-block;
  margin-left: 0.3rem;
  background: var(--border);
  border-radius: 10px;
  padding: 0 0.35rem;
  font-size: 0.62rem;
  color: var(--dim);
}
.status-tab.active .cnt { background: var(--accent); color: var(--bg); }

/* ── CONTROLS ── */
.controls {
  display: flex;
  gap: 0.5rem;
  padding: 0.5rem 1rem;
  border-bottom: 1px solid var(--border);
  align-items: center;
  flex-wrap: wrap;
  background: var(--surface);
}
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 0.5rem; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
input[type=text], select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--sans);
  font-size: 0.78rem;
  padding: 0.3rem 0.6rem;
  border-radius: 3px;
  outline: none;
  transition: border-color 0.15s;
}
input[type=text] { padding-left: 1.8rem; width: 220px; }
input[type=text]:focus, select:focus { border-color: var(--accent); }
select { cursor: pointer; }
.filter-label {
  font-size: 0.72rem;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 0.3rem;
  cursor: pointer;
  white-space: nowrap;
}
.filter-label input { cursor: pointer; accent-color: var(--accent); }

/* ── UPLOAD ── */
#upload-zone {
  margin: 5rem auto;
  max-width: 400px;
  border: 1px dashed var(--border);
  border-radius: 6px;
  padding: 3rem 2rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
}
#upload-zone:hover, #upload-zone.drag { border-color: var(--accent); }
#upload-zone h2 { font-size: 1rem; font-weight: 500; margin-bottom: 0.5rem; color: var(--text); }
#upload-zone p { color: var(--muted); font-size: 0.78rem; line-height: 1.7; }
#upload-zone .icon { font-size: 2rem; margin-bottom: 1rem; }
#upload-zone input { display: none; }

/* ── GRID ── */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1px;
  background: var(--border);
  padding: 0;
  border-top: 1px solid var(--border);
}

/* ── KARTA ── */
.card {
  background: var(--surface);
  display: flex;
  flex-direction: column;
  position: relative;
  transition: background 0.15s;
  animation: fadeIn 0.2s ease both;
}
.card:hover { background: var(--surface2); }

/* Status indikátor */
.card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}
.card.status-new::before    { background: var(--blue); }
.card.status-read::before   { background: var(--green); }
.card.status-hide::before   { background: var(--red); }

/* Obrázok */
.card-carousel {
  width: 100%;
  aspect-ratio: 3/4;
  position: relative;
  overflow: hidden;
  background: var(--bg);
}
.card-carousel img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.2s;
  cursor: zoom-in;
}
.card-carousel img.car-active { opacity: 1; }
.car-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex;
  justify-content: center;
  gap: 4px;
  padding: 5px 4px;
  background: linear-gradient(transparent, rgba(0,0,0,0.4));
  z-index: 2;
  pointer-events: none;
}
.car-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.45);
  flex-shrink: 0;
  pointer-events: all;
  cursor: pointer;
  border: none;
  padding: 0;
  transition: background 0.15s;
}
.car-dot.car-active { background: white; }
.car-btn {
  position: absolute;
  top: 50%; transform: translateY(-50%);
  background: rgba(255,255,255,0.82);
  border: none;
  border-radius: 50%;
  width: 24px; height: 24px;
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
  z-index: 3;
  opacity: 0;
  transition: opacity 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card-carousel:hover .car-btn { opacity: 1; }
.car-btn.prev { left: 5px; }
.car-btn.next { right: 5px; }
.car-count {
  position: absolute;
  top: 5px; right: 6px;
  font-family: var(--mono);
  font-size: 0.6rem;
  background: rgba(0,0,0,0.5);
  color: white;
  border-radius: 8px;
  padding: 1px 5px;
  z-index: 2;
  pointer-events: none;
}
.card-no-img {
  width: 100%;
  aspect-ratio: 3/4;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  color: var(--border);
  font-size: 2rem;
}

/* Body */
.card-body {
  padding: 0.6rem 0.7rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.card-title {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-author {
  font-size: 0.68rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  margin-top: 0.15rem;
}
.tag {
  font-family: var(--mono);
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 2px;
  background: var(--bg);
  color: var(--dim);
  border: 1px solid var(--border);
}
.tag.price { color: var(--accent); border-color: #3d2f15; background: #1e1608; }
.tag.cat   { color: #7ec8a4; border-color: #1a3328; background: #0d1e17; }

/* Akcie */
.card-actions {
  display: flex;
  gap: 1px;
  border-top: 1px solid var(--border);
  background: var(--border);
}
.action-btn {
  flex: 1;
  padding: 0.35rem 0;
  font-family: var(--mono);
  font-size: 0.6rem;
  background: var(--surface);
  border: none;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
  text-align: center;
  letter-spacing: 0.03em;
}
.action-btn:hover { background: var(--surface2); }
.action-btn.btn-read:hover  { color: var(--green); }
.action-btn.btn-hide:hover  { color: var(--red); }
.action-btn.btn-link:hover  { color: var(--blue); }
.action-btn.active-read { color: var(--green); background: #e8f5ee; }
.action-btn.active-hide { color: var(--red); background: #fde8e8; }
.action-btn.btn-delete:hover { color: var(--red); background: #fde8e8; }
.export-btn {
  padding: 0.3rem 0.8rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s;
}
.export-btn:hover { opacity: 0.85; }
.export-btn:disabled { opacity: 0.4; cursor: default; }
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 250;
  display: flex;
  align-items: center;
  justify-content: center;
}
.confirm-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.5rem;
  max-width: 320px;
  width: 90%;
  text-align: center;
}
.confirm-box h3 { font-size: 0.9rem; margin-bottom: 0.5rem; }
.confirm-box p { font-size: 0.75rem; color: var(--muted); margin-bottom: 1rem; }
.confirm-btns { display: flex; gap: 0.5rem; justify-content: center; }
.confirm-btns button {
  padding: 0.35rem 1rem;
  font-family: var(--mono);
  font-size: 0.7rem;
  border-radius: 3px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
}
.confirm-btns .btn-danger { background: var(--red); color: white; border-color: var(--red); }

/* ── LIGHTBOX ── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.92);
  z-index: 200;
  align-items: center;
  justify-content: center;
  cursor: zoom-out;
}
#lightbox.open { display: flex; }
#lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; }

/* ── PAGINATION ── */
.pagination {
  padding: 1rem;
  display: flex;
  gap: 0.3rem;
  align-items: center;
  flex-wrap: wrap;
  border-top: 1px solid var(--border);
}
.page-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 0.25rem 0.55rem;
  cursor: pointer;
  border-radius: 3px;
  font-family: var(--mono);
  font-size: 0.7rem;
  transition: all 0.12s;
}
.page-btn:hover, .page-btn.active { border-color: var(--accent); color: var(--accent); }
.page-info { color: var(--muted); font-family: var(--mono); font-size: 0.68rem; margin-left: auto; }

#empty { text-align: center; padding: 4rem; color: var(--muted); font-family: var(--mono); font-size: 0.8rem; display: none; }

/* ── NOTIFIKÁCIA ── */
.toast {
  position: fixed;
  bottom: 1.5rem;
  right: 1.5rem;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--mono);
  font-size: 0.72rem;
  padding: 0.5rem 1rem;
  border-radius: 4px;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
  z-index: 300;
}
.toast.show { opacity: 1; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>

<header>
  <div class="logo">PRESS.SK / ARCHÍV</div>
  <div class="stats" id="stats"></div>
  <button class="export-btn" id="export-btn" style="display:none" onclick="exportCSV()">↓ Exportovať CSV</button>
  <div class="status-tabs" id="status-tabs" style="display:none">
    <button class="status-tab active" data-status="all" onclick="setStatusFilter('all',this)">
      Všetky <span class="cnt" id="cnt-all">0</span>
    </button>
    <button class="status-tab" data-status="new" onclick="setStatusFilter('new',this)">
      Neprečítané <span class="cnt" id="cnt-new">0</span>
    </button>
    <button class="status-tab" data-status="read" onclick="setStatusFilter('read',this)">
      Prečítané <span class="cnt" id="cnt-read">0</span>
    </button>
  </div>
</header>

<div class="controls" id="controls" style="display:none">
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Hľadaj názov, autor…">
  </div>
  <select id="cat-filter"><option value="">Všetky kategórie</option></select>
  <select id="sort">
    <option value="title">Názov A–Z</option>
    <option value="title-desc">Názov Z–A</option>
    <option value="category">Kategória</option>
    <option value="date">Najnovšie</option>
    <option value="date-asc">Najstaršie</option>
  </select>
  <label class="filter-label"><input type="checkbox" id="only-img"> len s obr.</label>
</div>

<div id="upload-zone">
  <div class="icon">📚</div>
  <h2>Manažér produktov</h2>
  <p>Pretiahni <strong>products.csv</strong> sem<br>alebo klikni pre výber súboru</p>
  <input type="file" id="file-input" accept=".csv">
</div>

<div id="grid"></div>
<div id="empty">Žiadne výsledky.</div>
<div class="pagination" id="pagination" style="display:none"></div>

<div id="lightbox" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="" onclick="event.stopPropagation()">
</div>

<div class="toast" id="toast"></div>

<script>
// ── Stav ──
let allData = [], filtered = [];
const PAGE_SIZE = 60;
let currentPage = 1;
let statusFilter = 'all';
const STORAGE_KEY = 'presssk_status';

// Načítaj uložené stavy (localStorage)
function loadStatuses() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; }
}
function saveStatus(id, status) {
  const s = loadStatuses();
  s[id] = status;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}
function getStatus(id) {
  return loadStatuses()[id] || 'new';
}
function productId(r) {
  return (r.title + '|' + (r.author||'')).toLowerCase();
}

// ── CSV parser ──
function parseCSV(text) {
  const lines = text.split('\n');
  const headers = parseCSVLine(lines[0]);
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseCSVLine(lines[i]);
    const obj = {};
    headers.forEach((h, idx) => obj[h.trim()] = (vals[idx] || '').trim());
    if (obj.title) rows.push(obj);
  }
  return rows;
}
function parseCSVLine(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += c;
  }
  result.push(cur);
  return result;
}

function formatDate(ts) {
  if (!ts || ts.length < 8) return '';
  return `${ts.slice(0,4)}-${ts.slice(4,6)}`;
}

// ── Načítanie dát ──
function loadData(data) {
  allData = data;
  document.getElementById('upload-zone').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('status-tabs').style.display = 'flex';
  document.getElementById('export-btn').style.display = 'block';
  document.getElementById('pagination').style.display = 'flex';

  const cats = [...new Set(data.map(r => r.category).filter(Boolean))].sort();
  const sel = document.getElementById('cat-filter');
  sel.innerHTML = '<option value="">Všetky kategórie</option>';
  cats.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); });

  updateStats();
  applyFilters();
}

function updateStats() {
  const statuses = loadStatuses();
  const total = allData.length;
  const nNew  = allData.filter(r => !statuses[productId(r)] || statuses[productId(r)] === 'new').length;
  const nRead = allData.filter(r => statuses[productId(r)] === 'read').length;
  const nHide = allData.filter(r => statuses[productId(r)] === 'hide').length;

  document.getElementById('stats').innerHTML =
    `<b>${total.toLocaleString('sk')}</b> produktov`;

  document.getElementById('cnt-all').textContent  = total - nHide;
  document.getElementById('cnt-new').textContent  = nNew;
  document.getElementById('cnt-read').textContent = nRead;
}

// ── Filtre ──
function setStatusFilter(status, btn) {
  statusFilter = status;
  document.querySelectorAll('.status-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const q       = document.getElementById('search').value.toLowerCase();
  const cat     = document.getElementById('cat-filter').value;
  const sort    = document.getElementById('sort').value;
  const onlyImg = document.getElementById('only-img').checked;
  const statuses = loadStatuses();

  filtered = allData.filter(r => {
    const st = statuses[productId(r)] || 'new';
    if (st === 'hide') return false;  // nikdy nezobrazuj hide
    if (statusFilter === 'new'  && st !== 'new')  return false;
    if (statusFilter === 'read' && st !== 'read') return false;
    if (onlyImg && !r.image_urls) return false;
    if (cat && r.category !== cat) return false;
    if (q && !(r.title||'').toLowerCase().includes(q) && !(r.author||'').toLowerCase().includes(q)) return false;
    return true;
  });

  filtered.sort((a, b) => {
    if (sort === 'title')      return (a.title||'').localeCompare(b.title||'', 'sk');
    if (sort === 'title-desc') return (b.title||'').localeCompare(a.title||'', 'sk');
    if (sort === 'category')   return (a.category||'').localeCompare(b.category||'', 'sk');
    if (sort === 'date')       return (b.timestamp||'').localeCompare(a.timestamp||'');
    if (sort === 'date-asc')   return (a.timestamp||'').localeCompare(b.timestamp||'');
    return 0;
  });

  currentPage = 1;
  updateStats();
  render();
}

// ── Render ──
function render() {
  const start = (currentPage - 1) * PAGE_SIZE;
  const page  = filtered.slice(start, start + PAGE_SIZE);
  const grid  = document.getElementById('grid');
  grid.innerHTML = '';

  document.getElementById('empty').style.display = filtered.length === 0 ? 'block' : 'none';

  const statuses = loadStatuses();

  page.forEach((r, i) => {
    const id   = productId(r);
    const st   = statuses[id] || 'new';
    const imgs = (r.image_urls || '').split('|').map(u => u.trim()).filter(Boolean);
    const wb   = r.wayback_url || '';

    // Obrázky — carousel (max 30)
    let imgHtml;
    if (imgs.length > 0) {
      const shown = imgs.slice(0, 30);
      const cid   = 'c' + i + '_' + Math.random().toString(36).slice(2,6);
      const imgTags = shown.map((u, idx) => {
        const safe = u.replace(/'/g, "\\'");
        return `<img src="${u}" class="${idx===0?'car-active':''}" alt="" loading="${idx===0?'eager':'lazy'}" onerror="this.style.display='none'" onclick="openLightbox('${safe}')">`;
      }).join('');
      const dots = shown.length > 1
        ? `<div class="car-nav">${shown.map((_,idx)=>`<button class="car-dot ${idx===0?'car-active':''}" onclick="carGo('${cid}',${idx},event)"></button>`).join('')}</div>`
        : '';
      const btns = shown.length > 1
        ? `<button class="car-btn prev" onclick="carStep('${cid}',-1,event)">&#8249;</button><button class="car-btn next" onclick="carStep('${cid}',1,event)">&#8250;</button>`
        : '';
      const badge = shown.length > 1 ? `<span class="car-count">1/${shown.length}</span>` : '';
      imgHtml = `<div class="card-carousel" id="${cid}" data-idx="0" data-total="${shown.length}">${imgTags}${btns}${dots}${badge}</div>`;
    } else {
      imgHtml = `<div class="card-no-img">📖</div>`;
    }

    // Tagy
    const tags = [
      r.price    ? `<span class="tag price">${r.price} €</span>` : '',
      r.category ? `<span class="tag cat">${r.category}</span>`  : '',
      r.publisher? `<span class="tag">${r.publisher}</span>`     : '',
      r.timestamp? `<span class="tag">${formatDate(r.timestamp)}</span>` : '',
    ].filter(Boolean).join('');

    const card = document.createElement('div');
    card.className = `card status-${st}`;
    card.style.animationDelay = `${i * 0.008}s`;
    card.dataset.id = id;

    card.innerHTML = `
      ${imgHtml}
      <div class="card-body">
        <div class="card-title">${r.title}</div>
        ${r.author ? `<div class="card-author">${r.author}</div>` : ''}
        <div class="card-tags">${tags}</div>
      </div>
      <div class="card-actions">
        <button class="action-btn btn-read ${st==='read'?'active-read':''}"
          onclick="setStatus('${id}','${st==='read'?'new':'read'}',this.closest('.card'))">
          ${st==='read' ? '✓ prečítané' : '○ prečítať'}
        </button>
        <button class="action-btn btn-hide"
          onclick="setStatus('${id}','hide',this.closest('.card'))">
          ✕ skryť
        </button>
        <button class="action-btn btn-delete"
          onclick="confirmDelete('${id}',this.closest('.card'))">
          🗑
        </button>
        ${wb ? `<button class="action-btn btn-link" onclick="window.open('${wb}','_blank')">↗</button>` : ''}
      </div>`;

    grid.appendChild(card);
  });

  renderPagination();
}

function setStatus(id, status, card) {
  saveStatus(id, status);
  if (status === 'hide') {
    card.style.transition = 'opacity 0.2s, transform 0.2s';
    card.style.opacity = '0';
    card.style.transform = 'scale(0.95)';
    setTimeout(() => { card.remove(); applyFilters(); }, 200);
    showToast('Produkt skrytý — zmeniť môžeš v CSV');
  } else {
    card.className = `card status-${status}`;
    // Obnov tlačidlo
    const btn = card.querySelector('.btn-read');
    if (btn) {
      btn.textContent = status === 'read' ? '✓ prečítané' : '○ prečítať';
      btn.className   = `action-btn btn-read ${status==='read'?'active-read':''}`;
      btn.onclick = () => setStatus(id, status==='read'?'new':'read', card);
    }
    updateStats();
  }
}

// ── Export CSV ──
function exportCSV() {
  const deleted = getDeleted();
  const exportData = allData.filter(r => !deleted.has(productId(r)));
  if (!exportData.length) return;

  const headers = Object.keys(exportData[0]);
  const escape = v => {
    const s = String(v || '');
    return s.includes(',') || s.includes('"') || s.includes('\n')
      ? '"' + s.replace(/"/g, '""') + '"'
      : s;
  };
  const rows = [headers.join(',')];
  exportData.forEach(r => rows.push(headers.map(h => escape(r[h])).join(',')));
  const blob = new Blob([rows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'products.csv';
  a.click();
  showToast(`Exportovaných ${exportData.length.toLocaleString('sk')} produktov`);
}

// ── Trvale vymazanie ──
const DELETED_KEY = 'presssk_deleted';
function getDeleted() {
  try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || '[]')); } catch { return new Set(); }
}
function saveDeleted(id) {
  const d = getDeleted();
  d.add(id);
  localStorage.setItem(DELETED_KEY, JSON.stringify([...d]));
}

function confirmDelete(id, card) {
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `
    <div class="confirm-box">
      <h3>Trvale vymazať produkt?</h3>
      <p>Produkt bude odstránený z produktov. Exportuj CSV potom aby sa zmena uložila do súboru.</p>
      <div class="confirm-btns">
        <button onclick="this.closest('.confirm-overlay').remove()">Zrušiť</button>
        <button class="btn-danger" onclick="deleteProduct('${id}',this)">Vymazať</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function deleteProduct(id, btn) {
  btn.closest('.confirm-overlay').remove();
  saveDeleted(id);
  // Odstrán z allData
  allData = allData.filter(r => productId(r) !== id);
  applyFilters();
  showToast('Produkt vymazaný · exportuj CSV pre uloženie');
}

// ── Toast ──
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ── Lightbox ──
function openLightbox(url) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

// ── Carousel ──
function carGo(id, idx, e) {
  if (e) e.stopPropagation();
  const el = document.getElementById(id);
  if (!el) return;
  const imgs = el.querySelectorAll('img');
  const dots = el.querySelectorAll('.car-dot');
  const badge = el.querySelector('.car-count');
  const total = parseInt(el.dataset.total);
  imgs.forEach((img, i) => img.classList.toggle('active', i === idx));
  dots.forEach((d, i) => d.classList.toggle('active', i === idx));
  if (badge) badge.textContent = (idx+1) + '/' + total;
  el.dataset.idx = idx;
}
function carStep(id, dir, e) {
  if (e) e.stopPropagation();
  const el = document.getElementById(id);
  if (!el) return;
  const total = parseInt(el.dataset.total);
  const idx   = (parseInt(el.dataset.idx) + dir + total) % total;
  carGo(id, idx, null);
}

// ── Pagination ──
function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const pag   = document.getElementById('pagination');
  pag.innerHTML = '';
  if (total <= 1) { pag.style.display = 'none'; return; }
  pag.style.display = 'flex';

  const btn = (label, page, active=false) => {
    const b = document.createElement('button');
    b.className = 'page-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.onclick = () => { currentPage = page; render(); window.scrollTo(0,0); };
    pag.appendChild(b);
  };

  if (currentPage > 1) btn('←', currentPage - 1);
  let s = Math.max(1, currentPage - 2), e = Math.min(total, s + 4);
  if (e - s < 4) s = Math.max(1, e - 4);
  if (s > 1) { btn('1', 1); if (s > 2) { const sp = document.createElement('span'); sp.className='page-info'; sp.textContent='…'; pag.appendChild(sp); } }
  for (let p = s; p <= e; p++) btn(p, p, p === currentPage);
  if (e < total) { if (e < total-1) { const sp = document.createElement('span'); sp.className='page-info'; sp.textContent='…'; pag.appendChild(sp); } btn(total, total); }
  if (currentPage < total) btn('→', currentPage + 1);

  const info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = `${filtered.length.toLocaleString('sk')} produktov · str. ${currentPage}/${total}`;
  pag.appendChild(info);
}

// ── Súbor ──
function handleFile(file) {
  if (!file || !file.name.endsWith('.csv')) return;
  const reader = new FileReader();
  reader.onload = e => loadData(parseCSV(e.target.result));
  reader.readAsText(file, 'UTF-8');
}

document.getElementById('file-input').addEventListener('change', e => handleFile(e.target.files[0]));
const zone = document.getElementById('upload-zone');
zone.addEventListener('click', () => document.getElementById('file-input').click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('cat-filter').addEventListener('change', applyFilters);
document.getElementById('sort').addEventListener('change', applyFilters);
document.getElementById('only-img').addEventListener('change', applyFilters);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── Auto-load ──
async function autoLoad() {
  for (const path of ['output/products.csv', 'products.csv']) {
    try {
      const resp = await fetch(path);
      if (!resp.ok) continue;
      const text = await resp.text();
      if (!text.includes('title')) continue;
      const data = parseCSV(text);
      if (data.length > 0) { loadData(data); return; }
    } catch (_) {}
  }
}
autoLoad();
</script>
