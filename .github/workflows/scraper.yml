name: press.sk Scraper

on:
  workflow_dispatch:
    inputs:
      input_csv:
        description: 'Vstupny CSV subor (napr. output/relevant_20020101-20101231_001.csv)'
        required: true
        default: 'output/relevant_20020101-20101231_001.csv'
      limit:
        description: 'Pocet URL na spracovanie v tomto behu'
        required: true
        default: '100'
      no_images:
        description: 'Bez obrazkov (rychlejsie)'
        required: false
        type: boolean
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: mkdir -p output

      - name: Obnov stav (products, spracovane, nespracovane, input CSV)
        uses: actions/cache@v4
        with:
          path: |
            output/products.csv
            output/spracovane.csv
            output/nespracovane.csv
            output/relevant_*.csv
            output/skipped_*.csv
          key: scraper-state-${{ github.run_number }}
          restore-keys: scraper-state-

      - name: Stav pred spracovanim
        run: |
          echo "=== Vstupny subor ==="
          wc -l "${{ github.event.inputs.input_csv }}" 2>/dev/null || echo "Neexistuje"
          echo "=== products.csv ==="
          wc -l output/products.csv 2>/dev/null || echo "Neexistuje"
          echo "=== spracovane.csv ==="
          wc -l output/spracovane.csv 2>/dev/null || echo "Neexistuje"
          echo "=== nespracovane.csv ==="
          wc -l output/nespracovane.csv 2>/dev/null || echo "Neexistuje"

      - name: Spusti scraper
        run: |
          ARGS="--input ${{ github.event.inputs.input_csv }} --limit ${{ github.event.inputs.limit }}"
          if [ "${{ github.event.inputs.no_images }}" = "true" ]; then
            ARGS="$ARGS --no-images"
          fi
          echo "Spustam: python scraper.py $ARGS"
          python scraper.py $ARGS

      - name: Stav po spracovani
        if: always()
        run: |
          echo "=== Vstupny subor (zostatok) ==="
          wc -l "${{ github.event.inputs.input_csv }}" 2>/dev/null || echo "Prazdny/neexistuje"
          echo "=== products.csv ==="
          wc -l output/products.csv 2>/dev/null || echo "Neexistuje"
          echo "=== spracovane.csv ==="
          wc -l output/spracovane.csv 2>/dev/null || echo "Neexistuje"
          echo "=== nespracovane.csv ==="
          wc -l output/nespracovane.csv 2>/dev/null || echo "Neexistuje"
          echo "=== Poslednych 20 riadkov logu ==="
          tail -20 output/scraper.log 2>/dev/null || true

      - name: Uloz do repozitara
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/products.csv output/spracovane.csv output/nespracovane.csv \
                  output/scraper.log "${{ github.event.inputs.input_csv }}" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Ziadne zmeny."
          else
            PRODUCTS=$(wc -l < output/products.csv 2>/dev/null || echo 1)
            git commit -m "scraper: $((PRODUCTS-1)) produktov [run #${{ github.run_number }}]"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraper-results-${{ github.run_number }}
          path: |
            output/products.csv
            output/spracovane.csv
            output/nespracovane.csv
            output/scraper.log
          retention-days: 90
