name: Mapovanie URL (bez scrapingu)

on:
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Začiatok obdobia YYYYMMDD (napr. 20100101)'
        required: true
        default: '20100101'
      to_date:
        description: 'Koniec obdobia YYYYMMDD (napr. 20151231)'
        required: true
        default: '20151231'
      chunk_size:
        description: 'Záznamy na jeden CSV súbor (default 500000)'
        required: false
        default: '450000'
      from_offset:
        description: 'Resume od CDX offsetu (prázdne = od začiatku/resume)'
        required: false
        default: ''

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: mkdir -p output

      - name: Obnov progress cache
        uses: actions/cache@v4
        with:
          path: |
            output/map_progress_*.json
            output/relevant_*.csv
            output/skipped_*.csv
          key: map-${{ github.event.inputs.from_date }}-${{ github.event.inputs.to_date }}-${{ github.run_number }}
          restore-keys: |
            map-${{ github.event.inputs.from_date }}-${{ github.event.inputs.to_date }}-

      - name: Skontroluj resume
        run: |
          PERIOD="${{ github.event.inputs.from_date }}-${{ github.event.inputs.to_date }}"
          PERIOD="${PERIOD:0:4}-${PERIOD:12:4}"
          echo "Obdobie: $PERIOD"
          ls -lh output/relevant_*.csv output/skipped_*.csv 2>/dev/null || echo "Žiadne CSV"
          cat output/map_progress_*.json 2>/dev/null || echo "Žiadny progress"

      - name: Spusti mapovanie
        run: |
          ARGS="--from-date ${{ github.event.inputs.from_date }} --to-date ${{ github.event.inputs.to_date }}"
          ARGS="$ARGS --chunk-size ${{ github.event.inputs.chunk_size }}"
          if [ -n "${{ github.event.inputs.from_offset }}" ]; then
            ARGS="$ARGS --from-offset ${{ github.event.inputs.from_offset }}"
          fi
          echo "Spúšťam: python map_urls.py $ARGS"
          python map_urls.py $ARGS

      - name: Štatistiky
        if: always()
        run: |
          echo "=== Súbory ==="
          ls -lh output/relevant_*.csv output/skipped_*.csv 2>/dev/null || true
          echo "=== Riadky ==="
          wc -l output/relevant_*.csv output/skipped_*.csv 2>/dev/null || true
          echo "=== Log (posledných 15 riadkov) ==="
          tail -15 output/map_*.log 2>/dev/null || true

      - name: Ulož do repozitára
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/relevant_*.csv output/skipped_*.csv output/map_*.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Žiadne zmeny."
          else
            PERIOD="${{ github.event.inputs.from_date }}-${{ github.event.inputs.to_date }}"
            git commit -m "map ${PERIOD}: [run #${{ github.run_number }}]"
            git pull --rebase --autostash origin main || true
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: map-${{ github.event.inputs.from_date }}-${{ github.event.inputs.to_date }}-${{ github.run_number }}
          path: |
            output/relevant_*.csv
            output/skipped_*.csv
            output/map_*.log
          retention-days: 90
