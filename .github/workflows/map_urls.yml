name: Mapovanie URL (bez scrapingu)

on:
  workflow_dispatch:
    inputs:
      cdx_limit:
        description: 'Max URL z CDX (prázdne = všetky ~3M)'
        required: false
        default: ''
      chunk_size:
        description: 'Záznamy na jeden CSV súbor (default 500000)'
        required: false
        default: '500000'

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - run: mkdir -p output

      - name: Obnov progress cache
        uses: actions/cache@v4
        with:
          path: |
            output/map_progress.json
            output/urls_relevant_*.csv
            output/urls_skipped_*.csv
          key: map-progress-${{ github.run_number }}
          restore-keys: |
            map-progress-
            map-progress

      - name: Skontroluj resume stav
        run: |
          if [ -f output/map_progress.json ]; then
            echo "Resume nájdený:"
            cat output/map_progress.json
          else
            echo "Žiadny resume — začínam odznova"
          fi
          echo "Existujúce CSV súbory:"
          ls -lh output/urls_*.csv 2>/dev/null || echo "žiadne"

      - name: Spusti mapovanie
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.cdx_limit }}" ]; then
            ARGS="$ARGS --cdx-limit ${{ github.event.inputs.cdx_limit }}"
          fi
          if [ -n "${{ github.event.inputs.chunk_size }}" ]; then
            ARGS="$ARGS --chunk-size ${{ github.event.inputs.chunk_size }}"
          fi
          if [ -n "${{ github.event.inputs.start_offset }}" ]; then
            ARGS="$ARGS --start-offset ${{ github.event.inputs.start_offset }}"
          fi
          if [ -n "${{ github.event.inputs.end_offset }}" ]; then
            ARGS="$ARGS --end-offset ${{ github.event.inputs.end_offset }}"
          fi
          if [ -n "${{ github.event.inputs.from_offset }}" ]; then
            ARGS="$ARGS --from-offset ${{ github.event.inputs.from_offset }}"
          fi
          echo "Spúšťam: python map_urls.py $ARGS"
          python map_urls.py $ARGS

      - name: Štatistiky
        if: always()
        run: |
          echo "=== Relevant súbory ==="
          ls -lh output/urls_relevant_*.csv 2>/dev/null || echo "žiadne"
          echo "=== Skipped súbory ==="
          ls -lh output/urls_skipped_*.csv 2>/dev/null || echo "žiadne"
          echo "=== Riadky celkom ==="
          wc -l output/urls_relevant_*.csv output/urls_skipped_*.csv 2>/dev/null || true
          echo "=== Posledných 10 riadkov logu ==="
          tail -10 output/map_urls.log 2>/dev/null || true

      - name: Ulož do repozitára
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/urls_relevant_*.csv output/urls_skipped_*.csv output/map_urls.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Žiadne zmeny."
          else
            REL=$(wc -l output/urls_relevant_*.csv 2>/dev/null | tail -1 | awk '{print $1}' || echo 0)
            git commit -m "map: ~${REL} relevantných URL [run #${{ github.run_number }}]"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: url-maps-${{ github.run_number }}
          path: |
            output/urls_relevant_*.csv
            output/urls_skipped_*.csv
            output/map_urls.log
          retention-days: 90
