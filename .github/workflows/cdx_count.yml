name: Zisti pocet CDX URL

on:
  workflow_dispatch:
    inputs:
      month:
        description: 'Mesiac vo formáte YYYYMM (napr. 200810)'
        required: true
        default: '200810'

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Zisti pocet po dnoch
        run: python3 cdx_count.py ${{ github.event.inputs.month }}
