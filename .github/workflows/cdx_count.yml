name: Zisti počet CDX URL

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Zisti počet URL v CDX
        run: |
          python3 - << 'PYEOF'
          import urllib.request, json

          def count(url):
              with urllib.request.urlopen(url, timeout=30) as r:
                  data = json.loads(r.read())
              # Odpočítaj header riadok ak existuje
              rows = [x for x in data if x != ["original"] and x != [None] and x is not None]
              return len(rows)

          BASE = "http://web.archive.org/cdx/search/cdx?url=press.sk/*&output=json&fl=original&filter=statuscode:200&limit=1"

          # Celkový počet cez matchType
          with urllib.request.urlopen(
              "http://web.archive.org/cdx/search/cdx?url=press.sk/*&output=json&fl=original"
              "&filter=statuscode:200&limit=1&showNumPages=true&pageSize=5000", timeout=30
          ) as r:
              pages_total = int(r.read().strip())

          with urllib.request.urlopen(
              "http://web.archive.org/cdx/search/cdx?url=press.sk/*&output=json&fl=original"
              "&filter=statuscode:200&collapse=urlkey&limit=1&showNumPages=true&pageSize=5000", timeout=30
          ) as r:
              pages_unique = int(r.read().strip())

          print(f"Všetky snapshoty:  ~{pages_total * 5000:,} (stránok: {pages_total})")
          print(f"Unikátne URL:      ~{pages_unique * 5000:,} (stránok: {pages_unique})")
          print(f"Priemerný počet snapshotov na URL: ~{pages_total/max(pages_unique,1):.1f}x")
          PYEOF
