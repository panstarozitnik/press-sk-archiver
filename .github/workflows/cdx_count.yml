name: Zisti počet CDX URL

on:
  workflow_dispatch:

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Zisti počet URL v CDX
        run: |
          python3 << 'PYEOF'
import urllib.request, json, time

BASE = "http://web.archive.org/cdx/search/cdx?url=press.sk/*&output=json&fl=original&filter=statuscode:200"

def count_at_offset(url_base, offset, collapse=""):
    col = f"&collapse={collapse}" if collapse else ""
    url = f"{url_base}{col}&limit=5000&offset={offset}"
    with urllib.request.urlopen(url, timeout=60) as r:
        data = json.loads(r.read())
    return len([x for x in data if x and x[0] != "original"])

def find_total(url_base, collapse=""):
    # Skúšaj offsety 0, 100k, 200k... kým nedostaneme menej ako 5000
    step = 100000
    offset = 0
    while True:
        try:
            n = count_at_offset(url_base, offset, collapse)
            print(f"  offset={offset:,} → {n} riadkov")
            if n < 5000:
                return offset + n
            offset += step
            time.sleep(1)
        except Exception as e:
            print(f"  Chyba pri offset={offset}: {e}")
            return offset

print("=== Všetky snapshoty press.sk ===")
total = find_total(BASE)
print(f"CELKOM: ~{total:,}\n")

print("=== Unikátne URL (collapse=urlkey) ===")
unique = find_total(BASE, "urlkey")
print(f"UNIKÁTNYCH URL: ~{unique:,}")
print(f"Priemerný počet snapshotov/URL: ~{total/max(unique,1):.1f}x")
PYEOF
