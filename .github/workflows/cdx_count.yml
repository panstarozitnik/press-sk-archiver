name: Zisti pocet CDX URL

on:
  workflow_dispatch:
    inputs:
      period:
        description: 'Rok (napr. 2008) = po mesiacoch | Mesiac (napr. 200810) = po dňoch'
        required: true
        default: '2008'

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Zisti pocet
        run: python3 cdx_count.py ${{ github.event.inputs.period }}
