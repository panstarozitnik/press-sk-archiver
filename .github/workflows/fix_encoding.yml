name: Oprav encoding v products.csv

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - len zobraz zmeny'
        type: boolean
        default: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inštaluj závislosti
        run: pip install -r requirements.txt

      - name: Načítaj products.csv
        run: |
          git checkout origin/main -- output/products.csv 2>/dev/null || true
          echo "Riadkov: $(wc -l < output/products.csv)"

      - name: Oprav encoding
        run: |
          ARGS="--products output/products.csv"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python fix_encoding_csv.py $ARGS

      - name: Ulož
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/products.csv
          if git diff --cached --quiet; then
            echo "Žiadne zmeny."
          else
            git commit -m "fix_encoding: oprava mojibake v products.csv"
            git pull --rebase --autostash origin main || true
            git push
          fi
